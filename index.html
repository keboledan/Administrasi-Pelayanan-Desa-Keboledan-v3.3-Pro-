    return JSON.parse(localStorage.getItem('desa_keboledan_v3_2_db')) || def;
}

function saveDB(targetKey = null) {
    localStorage.setItem('desa_keboledan_v3_2_db', JSON.stringify(APP_STATE.db));
    if (typeof google !== 'undefined' && google.script && google.script.run) {
        const statusEl = document.getElementById('sync-status');
        if (statusEl) statusEl.innerHTML = `<i class="fas fa-spinner fa-spin text-amber-500"></i> Syncing...`;
        
        if (targetKey) {
            google.script.run.withSuccessHandler(() => {
                if (statusEl) statusEl.innerHTML = `<i class="fas fa-cloud-check text-emerald-600"></i> Spreadsheet Active`;
            }).saveSheetData(targetKey, APP_STATE.db[targetKey]);
        } else {
            Object.keys(APP_STATE.db).forEach(key => {
                google.script.run.saveSheetData(key, APP_STATE.db[key]);
            });
            if (statusEl) statusEl.innerHTML = `<i class="fas fa-cloud-check text-emerald-600"></i> Spreadsheet Active`;
        }
    }
}

function fetchSpreadsheetData() {
    if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run.withSuccessHandler((sheetDB) => {
            if (sheetDB && Object.keys(sheetDB).length > 0) {
                APP_STATE.db = { ...APP_STATE.db, ...sheetDB };
                localStorage.setItem('desa_keboledan_v3_2_db', JSON.stringify(APP_STATE.db));
                if (APP_STATE.currentUser) navigate(APP_STATE.currentPage);
            }
        }).getInitialData();
    }
}

function addLog(action) {
    if (!APP_STATE.db.log) APP_STATE.db.log = [];
    APP_STATE.db.log.push({ user: APP_STATE.currentUser ? APP_STATE.currentUser.role : 'System', action, time: Date.now() });
    saveDB('log');
}

// Fungsi Generator Penomoran Surat Otomatis Berdasarkan Kode & Tahun
function generateAutoNomorSurat(kodeKlasifikasi = '470') {
    const totalSurat = (APP_STATE.db.arsip_surat || []).length + 1;
    const noUrut = String(totalSurat).padStart(3, '0');
    const bulanRomawi = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X", "XI", "XII"][new Date().getMonth()];
    const tahun = new Date().getFullYear();
    return `${kodeKlasifikasi} / ${noUrut} / ${bulanRomawi} / ${tahun}`;
}

// Fungsi Tanggal Otomatis Format Indonesia
function getAutoTanggalSistem() {
    return new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
}

function changePaperSize(sizeClass) {
    const el = document.getElementById('print-area');

}, 1000);

function handleLogin(e) {
    e.preventDefault();
    const u = document.getElementById('username').value, p = document.getElementById('password').value;
    if (USERS[u] && USERS[u].pass === p) {
        APP_STATE.currentUser = { id: u, ...USERS[u] };
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('app-screen').classList.remove('hidden');
        document.getElementById('user-role-display').innerText = APP_STATE.currentUser.role;
        fetchSpreadsheetData();
        addLog('Login ke Sistem');
        renderSidebar();
        navigate('beranda');
        Swal.fire({ icon: 'success', title: 'Login Berhasil', text: `Selamat datang, ${APP_STATE.currentUser.name}`, showConfirmButton: false, timer: 1500 });
    } else {
        Swal.fire({ icon: 'error', title: 'Akses Ditolak', text: 'Username atau Password salah!' });
    }
}

function handleLogout() {
    Swal.fire({ title: 'Keluar Sistem?', icon: 'question', showCancelButton: true, confirmButtonColor: '#d33', confirmButtonText: 'Ya, Keluar' }).then((result) => {
        if (result.isConfirmed) {
            addLog('Logout dari Sistem');
            APP_STATE.currentUser = null;
            document.getElementById('app-screen').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('login-form').reset();
        }
    });
}

function renderSidebar() {

function populateTable(dbKey, cols, fieldsStr) {
    const tbody = document.querySelector(`#table-${dbKey} tbody`);
    tbody.innerHTML = '';
    const data = APP_STATE.db[dbKey] || [];
    if(data.length===0){
        tbody.innerHTML=`<tr><td colspan="${cols.length+2}" class="text-center p-16 text-slate-400"><i class="fas fa-folder-open text-6xl mb-4 block text-slate-200"></i><p class="text-lg font-semibold text-slate-500">Database Kosong</p><p class="text-sm mt-1">Silakan tambah data manual atau Upload file CSV.</p></td></tr>`;
        return;
    }
    
    data.forEach((row, i) => {
        let html = `<td class="py-3 px-5 text-center text-slate-500 bg-slate-50/50">${i+1}</td>`;
        
        cols.forEach(c => {
            let val = row[c.key] || '-';
            if(val.length > 100 && val.startsWith('data:image')) val = `<span class="bg-blue-100 text-blue-700 px-3 py-1.5 rounded-lg text-xs font-bold border border-blue-200"><i class="fas fa-image mr-1"></i> Scan Tersedia</span>`;
            else if (val.startsWith('http')) val = `<a href="${val}" target="_blank" class="bg-indigo-100 text-indigo-700 px-3 py-1.5 rounded-lg text-xs font-bold border border-indigo-200 hover:bg-indigo-200 transition"><i class="fas fa-link mr-1"></i> Buka Link</a>`;
            html += `<td class="py-3 px-5 truncate max-w-xs" title="${val}">${val}</td>`;
        });

function handleFileToInput(fileInput, targetInputId) {
    const file = fileInput.files[0];
    if(!file) return;
    if(file.size > 2 * 1024 * 1024) return Swal.fire('Error', 'Ukuran file gambar maksimal 2MB untuk penyimpanan.', 'error');
    
    const reader = new FileReader();
    reader.onload = (e) => {
        document.getElementById(targetInputId).value = e.target.result;
        const previewImg = document.getElementById(`preview-img-${targetInputId}`);
        if(previewImg) {
            previewImg.src = e.target.result;
            previewImg.classList.remove('hidden');
        }
    };
    reader.readAsDataURL(file);
}

function buildFormHtml(fields, data = {}) {
    let html = '<div class="grid grid-cols-1 md:grid-cols-2 gap-4">';
    fields.forEach(f => {
        const label = f.replace(/_/g, ' ').toUpperCase();
        let val = data[f] || '';
        const isScan = f.startsWith('scan');
        
        if (isScan) {
            html += `<div class="col-span-1 md:col-span-2 p-3 bg-blue-50 rounded-xl border border-blue-200">
                <label class="block text-xs font-extrabold text-blue-800 mb-2"><i class="fas fa-file-upload mr-1"></i> UNGGAH DOKUMEN: ${label}</label>
                <div class="flex gap-2 items-center">
                    <input type="text" id="inp-${f}" value="${val}" class="flex-1 p-2.5 bg-white border border-blue-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500" placeholder="Paste Link URL atau Browse Gambar">
                    <input type="file" id="file-${f}" accept="image/*" class="hidden" onchange="handleFileToInput(this, 'inp-${f}')">
                    <label for="file-${f}" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2.5 rounded-lg cursor-pointer text-sm font-bold whitespace-nowrap shadow-md transition"><i class="fas fa-camera mr-1"></i> Browse Scan</label>
                </div>
                <img id="preview-img-inp-${f}" src="${val.startsWith('data:image')?val:''}" class="mt-3 max-h-32 rounded-lg border border-blue-300 shadow-sm object-cover ${val.startsWith('data:image')?'':'hidden'}">
            </div>`;
        } else if (f === 'alamat' || f === 'keterangan') {
            html += `<div class="col-span-1 md:col-span-2 text-left"><label class="block text-xs font-bold text-slate-700 mb-1">${label}</label><textarea id="inp-${f}" rows="2" class="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-green-500 outline-none">${val}</textarea></div>`;
        } else {
            html += `<div class="text-left"><label class="block text-xs font-bold text-slate-700 mb-1">${label}</label><input id="inp-${f}" value="${val}" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-green-500 outline-none font-medium"></div>`;
        }
    });
    html += '</div>';
    return html;
}

function handleCSVUpload(e, dbKey) {
    const file = e.target.files[0];
    if(!file) return;
    Papa.parse(file, { header: true, skipEmptyLines: true, complete: function(res) {
        if(res.data.length > 0) {
            if(!APP_STATE.db[dbKey]) APP_STATE.db[dbKey] = [];
            APP_STATE.db[dbKey] = [...APP_STATE.db[dbKey], ...res.data];
            saveDB(dbKey);
            addLog(`Upload CSV ke ${dbKey}`);
            navigate(dbKey);
            Swal.fire('Berhasil', `${res.data.length} baris diimpor & disimpan ke Spreadsheet!`, 'success');
        }
    }});
}

function exportDataExcel(dbKey) {
    const data = APP_STATE.db[dbKey] || [];
    if(!data.length) return Swal.fire('Kosong', 'Tidak ada data untuk diekspor', 'info');
    const cleanData = data.map(row => {
        let newRow = {};
        for(let k in row) newRow[k] = (row[k] && row[k].toString().startsWith('data:image')) ? 'Terdapat File Scan' : row[k];
        return newRow;
    });
    const ws = XLSX.utils.json_to_sheet(cleanData);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Data");
    XLSX.writeFile(wb, `Eksport_${dbKey}_${Date.now()}.xlsx`);
    addLog(`Eksport Excel ${dbKey}`);
}

function downloadAsWord(htmlString, filename) {
    const header = "<html xmlns:o='urn:schemas-microsoft-com:office:office' "+
                   "xmlns:w='urn:schemas-microsoft-com:office:word' "+
                   "xmlns='http://www.w3.org/TR/REC-html40'>"+
                   "<head><meta charset='utf-8'><title>Export Word</title></head><body>";
    const footer = "</body></html>";
    const sourceHTML = header + htmlString + footer;
    const source = 'data:application/vnd.ms-word;charset=utf-8,' + encodeURIComponent(sourceHTML);
    const fileDownload = document.createElement("a");
    document.body.appendChild(fileDownload);
    fileDownload.href = source;
    fileDownload.download = `${filename}.doc`;
    fileDownload.click();
    document.body.removeChild(fileDownload);
}

function exportDataWord(dbKey, title) {
    const data = APP_STATE.db[dbKey] || [];
    if(!data.length) return Swal.fire('Kosong', 'Tidak ada data untuk diekspor', 'info');
    
    let html = `<h2 style="text-align:center;font-family:sans-serif;margin-bottom:20px;">Laporan Data ${title} - Desa Keboledan</h2>`;
    html += `<table border="1" cellpadding="5" style="border-collapse: collapse; width: 100%; text-align: left; font-family:sans-serif; font-size:12px;"><thead><tr style="background-color:#f0f0f0;">`;
    const keys = Object.keys(data[0]);
    html += `<th>No</th>`;
    keys.forEach(k => html += `<th>${k.replace(/_/g, ' ').toUpperCase()}</th>`);
    html += `</tr></thead><tbody>`;
    
    data.forEach((row, idx) => {
        html += `<tr><td>${idx+1}</td>`;
        keys.forEach(k => {
            let val = row[k]||'';
            if(val.startsWith('data:image')) val = 'Ada Lampiran Scan';
            html += `<td>${val}</td>`;
        });
        html += `</tr>`;
    });
    html += `</tbody></table>`;
    downloadAsWord(html, `Laporan_${dbKey}`);
    addLog(`Eksport Word ${dbKey}`);
}

function exportDataPDF(dbKey, title) {
    const table = document.getElementById(`table-${dbKey}`);
    if(!table) return;
    
    const style = document.createElement('style');
    style.innerHTML = `th:last-child, td:last-child { display: none !important; } td { font-size: 10px; padding: 4px; }`;
    document.head.appendChild(style);
    
    html2pdf().set({
        margin: 0.3,
        filename: `Laporan_${dbKey}.pdf`,
        html2canvas: { scale: 2, useCORS: true },
        jsPDF: { unit: 'in', format: 'legal', orientation: 'landscape' }
    }).from(table).save().then(()=>{ document.head.removeChild(style); });
    addLog(`Eksport PDF ${dbKey}`);
}

function printTable(dbKey, title) {
    const data = APP_STATE.db[dbKey] || [];
    if(!data.length) return Swal.fire('Kosong', 'Tidak ada data untuk dicetak', 'info');
    
    let html = `<html><head><title>Print Laporan ${title}</title>
    <style>
        body { font-family: 'Arial', sans-serif; padding: 20px; }
        h2 { text-align: center; text-transform: uppercase; margin-bottom: 5px; }
        p.sub { text-align: center; margin-top: 0; font-size: 14px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th, td { border: 1px solid #000; padding: 8px; text-align: left; }
        th { background: #e2e8f0; font-weight: bold; }
    </style></head><body>
    <h2>Data ${title}</h2>
    <p class="sub">Pemerintah Desa Keboledan - Kec. Wanasari, Kab. Brebes<br>Dicetak pada: ${new Date().toLocaleString('id-ID')}</p>
    <table><thead><tr><th>No</th>`;
    
    const keys = Object.keys(data[0]);
    keys.forEach(k => html += `<th>${k.replace(/_/g, ' ').toUpperCase()}</th>`);
    html += `</tr></thead><tbody>`;
    
    data.forEach((row, i) => {
        html += `<tr><td>${i+1}</td>`;
        keys.forEach(k => {
            let val = row[k]||'';
            if(val.startsWith('data:image')) val = `<span style="font-size:10px;font-style:italic;">[Gambar Scan]</span>`;
            else if(val.startsWith('http')) val = `<span style="font-size:10px;font-style:italic;">[Link Eksternal]</span>`;
            html += `<td>${val}</td>`;
        });
        html += `</tr>`;
    });
    html += `</tbody></table>
    <div style="margin-top:50px; width:300px; float:right; text-align:center;">
        <p>Mengetahui,<br>Kepala Desa Keboledan</p><br><br><br><p style="font-weight:bold;text-decoration:underline;">SAIRUN</p>
    </div>
    <script>window.onload = function() { window.print(); window.onafterprint = function(){ window.close(); } };<\/script>
    </body></html>`;
    
    const win = window.open('', '_blank');
    win.document.write(html);
    win.document.close();
    addLog(`Print Tabel ${dbKey}`);
}

function resetWorkspaceEditor() {
    document.getElementById('editor-title').value = '';
    if(quillEditor) quillEditor.root.innerHTML = '';
    currentWorkspaceEditIndex = -1;
}

function saveWorkspaceDoc(dbKey) {
    const title = document.getElementById('editor-title').value.trim() || 'Dokumen Tanpa Judul';
    const content = quillEditor.root.innerHTML;
    if(!content || content === '<p><br></p>') return Swal.fire('Kosong', 'Isi dokumen tidak boleh kosong', 'warning');
    
    const docObj = {
        tipe: 'Dokumen Teks',
        nama: title,
        tanggal: new Date().toLocaleDateString('id-ID', {day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'}),
        content: content
    };
    
    if(currentWorkspaceEditIndex >= 0) {
        APP_STATE.db[dbKey][currentWorkspaceEditIndex] = docObj;
        addLog(`Update dokumen arsip: ${title}`);
    } else {
        APP_STATE.db[dbKey].push(docObj);
        addLog(`Buat dokumen arsip: ${title}`);
    }
    
    saveDB(dbKey);
    renderWorkspaceFileList(dbKey);
    Swal.fire('Tersimpan', 'Dokumen tersimpan ke Spreadsheet', 'success');
}

function editWorkspaceDoc(dbKey, index) {
    const item = APP_STATE.db[dbKey][index];
    if(item.tipe !== 'Dokumen Teks') return showWorkspaceFilePreview(item);
    
    document.getElementById('editor-title').value = item.nama;
    quillEditor.root.innerHTML = item.content || '';
    currentWorkspaceEditIndex = index;
    Swal.fire({toast:true, position:'top-end', icon:'info', title:'Dokumen siap diedit / dipratinjau', showConfirmButton:false, timer:1500});
}

function showWorkspaceFilePreview(item) {
    let html = `<div class="text-center p-4">
        <i class="fas fa-file-alt text-6xl text-slate-300 mb-4 block"></i>
        <h3 class="font-bold text-lg">${item.nama}</h3>
        <p class="text-sm text-slate-500 mb-4">${item.tipe} | ${item.ukuran||'-'} | diupload ${item.tanggal}</p>`;
    
    if(item.content && item.content.startsWith('data:image')) {
        html += `<img src="${item.content}" class="max-w-full h-auto rounded-lg border shadow-sm mx-auto">`;
    }
    html += `</div>`;
    Swal.fire({title: 'Preview File', html: html, confirmButtonText: 'Tutup'});
}

function handleWorkspaceUpload(event, dbKey) {
    const files = event.target.files;
    if(!files.length) return;
    
    Array.from(files).forEach(f => {
        const isImg = f.type.startsWith('image/');
        if(isImg && f.size < 2*1024*1024) {
            const reader = new FileReader();
            reader.onload = (e) => {
                APP_STATE.db[dbKey].push({
                    tipe: 'File Gambar', nama: f.name, ukuran: (f.size/1024).toFixed(1)+'KB',
                    tanggal: new Date().toLocaleDateString('id-ID'), content: e.target.result
                });
                saveDB(dbKey);
                renderWorkspaceFileList(dbKey);
            };
            reader.readAsDataURL(f);
        } else {
            APP_STATE.db[dbKey].push({
                tipe: f.name.endsWith('.csv')?'Data CSV':'File Upload', nama: f.name,
                ukuran: (f.size/1024).toFixed(1)+'KB', tanggal: new Date().toLocaleDateString('id-ID')
            });
        }
    });
    
    setTimeout(()=>{
        saveDB(dbKey);
        addLog(`Upload file ke arsip`);
        renderWorkspaceFileList(dbKey);
        Swal.fire('Berhasil', 'File ditambahkan ke Spreadsheet', 'success');
    }, 500);
}

function renderWorkspaceFileList(dbKey) {
    const list = document.getElementById('workspace-file-list');
    const data = APP_STATE.db[dbKey] || [];
    list.innerHTML = data.length === 0 ? '<li class="text-slate-400 text-sm text-center py-10 border-2 border-dashed border-slate-200 rounded-xl bg-white"><i class="fas fa-folder-open text-3xl mb-2 block"></i>Belum ada arsip</li>' : '';
    
    data.forEach((item, index) => {
        const isDoc = item.tipe === 'Dokumen Teks';
        const isImg = item.tipe === 'File Gambar';
        let icon = 'fa-file text-slate-400';

        list.innerHTML += `<li class="p-3 border border-slate-200 rounded-xl bg-white flex justify-between items-center hover:shadow-md hover:border-green-300 transition group file-item cursor-pointer" onclick="editWorkspaceDoc('${dbKey}', ${index})">

                    <p class="text-sm font-bold text-slate-800 truncate file-name">${item.nama}</p>

function filterWorkspaceList() {
    const term = document.getElementById('search-workspace').value.toLowerCase();
    const items = document.querySelectorAll('.file-item');
    items.forEach(item => {
        const name = item.querySelector('.file-name').innerText.toLowerCase();
        item.style.display = name.includes(term) ? '' : 'none';
    });

function autoFillPenduduk(val) {
    if(!val) return;
    const term = val.toLowerCase().trim();
    const data = (APP_STATE.db.penduduk || []).find(p => (p.nik && p.nik.toLowerCase() === term) || (p.nama && p.nama.toLowerCase().includes(term)) );
    
    if(data) {
        const fieldMap = {
            's_nik': data.nik, 's_nama': data.nama, 's_tempat_lahir': data.tempat_lahir,
            's_tanggal_lahir': data.tanggal_lahir, 's_jk': data.jk, 's_agama': data.agama,
            's_pekerjaan': data.pekerjaan, 's_alamat': data.alamat, 's_rt': data.rt, 's_rw': data.rw,
            'f_nik': data.nik, 'f_nama': data.nama, 'f_pekerjaan': data.pekerjaan, 'f_alamat': data.alamat,
            't_nik': data.nik, 't_nama': data.nama, 't_alamat': data.alamat
        };
        for(let key in fieldMap) {
            const el = document.getElementById(key);
            if(el && fieldMap[key]) el.value = fieldMap[key];
        }
        Swal.fire({toast:true, position:'top-end', icon:'success', title:`Data ditemukan: ${data.nama}`, showConfirmButton:false, timer:1500});
    } else {
        Swal.fire({toast:true, position:'top-end', icon:'warning', title:'Data penduduk tidak ditemukan', showConfirmButton:false, timer:1500});
    }
}

// BUKU C Helper Render Functions
function renderBukuCList(type) {
    const list = type === 'sawah' ? BUKU_C_STATE.sawahList : BUKU_C_STATE.keringList;
    const container = document.getElementById(type === 'sawah' ? 'bc-sawah-container' : 'bc-kering-container');
    if (!container) return;
    container.innerHTML = list.map((item, idx) => `
    <div class="p-2.5 bg-white border border-slate-200 rounded-xl text-xs space-y-1 relative">
        <button onclick="hapusBukuCRow('${type}', ${idx})" class="absolute top-2 right-2 text-red-500 font-bold"><i class="fas fa-times-circle"></i></button>
        <p class="font-bold text-slate-800">Persil ${item.persil} | Kelas ${item.kelas} | Luas ${item.luas} m²</p>
        <p class="text-slate-500">${item.perubahan || 'Tanpa perubahan'}</p>
    </div>`).join('');
}

function tambahBukuCRow(type) {
    Swal.fire({
        title: `Tambah Tanah ${type === 'sawah' ? 'Sawah' : 'Kering'}`,
        html: `
        <div class="text-left space-y-2 text-xs">
            <input id="sw_bc_p" placeholder="Nomor Persil" class="w-full p-2 border rounded">
            <input id="sw_bc_k" placeholder="Kelas Desa (Contoh: S.III)" class="w-full p-2 border rounded">
            <input id="sw_bc_l" placeholder="Luas Milik (m²)" class="w-full p-2 border rounded">
            <input id="sw_bc_pajak" placeholder="Pajak (Rp)" class="w-full p-2 border rounded">
            <input id="sw_bc_perubahan" placeholder="Sebab dan Tanggal Perubahan" class="w-full p-2 border rounded">
        </div>`,
        showCancelButton: true,
        confirmButtonText: 'Tambah'
    }).then(r => {
        if(r.isConfirmed) {
            const row = {
                persil: document.getElementById('sw_bc_p').value || '-',
                kelas: document.getElementById('sw_bc_k').value || '-',
                luas: document.getElementById('sw_bc_l').value || '0',
                pajak: document.getElementById('sw_bc_pajak').value || '',
                perubahan: document.getElementById('sw_bc_perubahan').value || ''
            };
            if(type === 'sawah') BUKU_C_STATE.sawahList.push(row);
            else BUKU_C_STATE.keringList.push(row);
            renderBukuCList(type);
        }
    });
}

function hapusBukuCRow(type, idx) {
    if(type === 'sawah') BUKU_C_STATE.sawahList.splice(idx, 1);
    else BUKU_C_STATE.keringList.splice(idx, 1);
    renderBukuCList(type);
}
